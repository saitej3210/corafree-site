function saveR(k,id,f){const S=SC[k],o=id?D[k].find(x=>x.id==id):{id:uid()};S.forEach(([n,,t])=>{const e=f.elements[n];o[n]=t=='b'?e.checked:t=='n'?+e.value:e.value});if(!id)D[k].push(o);save();draw()}

 it.forEach(i=>{const m=D.menu.find(x=>x.id==i.id)});D.orders.push({id:'#'+(1000+D.orders.length),branch:f.elements.br.value,table:+f.elements.tb.value,items:it,total:tot,status:'new',t:Date.now(),phone:f.elements.ph.value});

 if(o.status=='paid'){const t=D.tables.find(x=>x.branch==o.branch&&x.n==o.table);if(t)t.status='free';const c=o.phone&&D.cust.find(x=>x.phone==o.phone);if(c){c.points+=Math.floor(o.total/10);c.visits++}else if(o.phone)D.cust.push({id:uid(),name:'Guest',phone:o.phone,points:Math.floor(o.total/10),visits:1})}save();draw()}}

const V={
 orders:()=>`<p style="margin-bottom:12px"><button onclick="newOrder()">+ New order</button></p>`+tbl(['Order','Branch','Table','Items','Total','Status','Time',''],F(D.orders).sort((a,b)=>b.t-a.t).slice(0,40).map(o=>[o.id,bn(o.branch),o.table,txt(o),inr(o.total),badge(o.status),new Date(o.t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),o.status=='paid'?'':`<button class="s" onclick="adv('${o.id}')">→ ${ST[ST.indexOf(o.status)+1]}</button>`])),

 dash:()=>{const o=F(D.orders),t0=o.filter(x=>day(x.t)==today()),rev=a=>a.reduce((s,x)=>s+x.total,0),ex=F(D.exp).reduce((s,x)=>s+x.amt,0),days=[...Array(7)].map((_,i)=>{const d=day(Date.now()-(6-i)*864e5);return[d.slice(5),rev(o.filter(x=>day(x.t)==d))]}),mx=Math.max(...days.map(d=>d[1]),1),cnt={};o.forEach(x=>x.items.forEach(i=>cnt[i.id]=(cnt[i.id]||0)+i.q));const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);

 <div class="c"><h3>Sales by category</h3>${ct.map(([n,v])=>`<div class="bar"><span style="width:70px">${n}</span><i style="width:${v/tt*120}px"></i><span style="color:var(--mu)">${Math.round(v/tt*100)}%</span></div>`).join('')}</div></div>
 <div class="three"><div class="c"><h3>Busy hours</h3><div style="display:flex;gap:3px;align-items:end;height:90px">${hr.map((n,h)=>`<div title="${h}:00 · ${n} orders" style="flex:1;height:${Math.max(3,n/hm*100)}%;background:${n==hm?'var(--ac)':'rgba(var(--acrgb),0.33)'};border-radius:3px"></div>`).join('')}</div><span style="color:var(--mu);font-size:12px">12am → 11pm</span></div>
 <div class="c"><h3>Top sellers</h3>${top.map(([id,n])=>`<div class="bar"><span style="width:130px">${mn(id)}</span><i style="width:${n/top[0][1]*70}px"></i>${n}</div>`).join('')}</div>
 <div class="c"><h3>Needs attention</h3>${F(D.inv).filter(x=>x.qty<=x.min).map(x=>`<div class="ins">📦 ${x.name} low (${x.qty} ${x.unit})</div>`).join('')||'<p style="color:var(--mu)">Stock is healthy.</p>'}</div></div>`};
V.kitchen=()=>{const cols={new:'🆕 New',cooking:'🔥 Cooking',ready:'✅ Ready'};return`<div class="col">${Object.entries(cols).map(([s,l])=>{const a=F(D.orders).filter(o=>o.status==s);return`<div><h3>${l}<span class="b ${s}">${a.length}</span></h3>${a.map(o=>{const m=Math.round((Date.now()-o.t)/6e4);return`<div class="tk ${m>20&&s!='ready'?'late':''}" onclick="adv('${o.id}')"><em>${m>600?'—':m+' min'}</em><b>${o.id} · Table ${o.table}</b><br>${txt(o)}<br><span style="color:var(--mu)">${bn(o.branch)} · tap to move →</span></div>`}).join('')||'<p style="color:var(--mu);margin-top:10px">Nothing here</p>'}</div>`}).join('')}</div>`};
V.tables=()=>`<p style="color:var(--mu);margin-bottom:14px">Tap a table to change its status. <button onclick="edit('tables')">+ Add table</button></p><div class="flr">${F(D.tables).sort((a,b)=>a.n-b.n).map(t=>`<div class="tb ${t.status}" onclick="cyc('${t.id}')"><b>${t.n}</b>${t.seats} seats<br>${badge(t.status)}<br><small style="color:var(--mu)">${bn(t.branch)}</small></div>`).join('')}</div>`;
function cyc(id){const t=D.tables.find(x=>x.id==id),a=['free','busy','reserved'];t.status=a[(a.indexOf(t.status)+1)%3];save();draw();toast(`Table ${t.n} is now ${t.status}`)}
setInterval(()=>{if(me&&(view=='kitchen'||view=='dash')&&!$('#dlg').open){$('#v').innerHTML=vw();fq()}},30000);
/* ===== help system ===== */
const HELP={
dash:['Analytics','Your business at a glance: today\'s money, orders, busy hours and best sellers.','Revenue/Orders show % change vs yesterday. Busy hours tells you when to schedule more staff. "Needs attention" lists low stock. Pick a branch (top right) to compare outlets.','Admin only'],
orders:['Orders','Every order from table to payment. Create new orders and move them through the stages.','Tap "+ New order", choose table and items. Use the arrow button to move: new → cooking → ready → served → paid. Paying frees the table and gives loyalty points if a phone number was entered.','Admin, Manager, Waiter'],
kitchen:['Kitchen display','A live board for chefs showing what to cook now.','Tap a ticket to move it to the next stage. Timer shows minutes waiting; red blinking means over 20 minutes, so prioritise it. Board refreshes every 30 seconds.','Admin, Kitchen, Waiter'],
tables:['Tables','Floor view of every table and its current status.','Tap a table to switch free → busy → reserved. Green is free, red is busy, amber is reserved. Use "+ Add table" for new seating or Edit from the list in other tools.','Admin, Manager, Waiter'],
qr:['QR codes','Printable QR code for each table so guests can open your site for that table.','Print the page, cut and stick one on each table. Scanning opens the café site with the branch and table number.','Admin, Manager, Waiter'],
menu:['Menu','Your dishes, prices and availability.','"+ Add" a dish, Edit to change price or category. Untick Available when an item runs out so it disappears from new orders.','Admin, Manager'],
inv:['Inventory','Raw material stock and reorder levels per branch.','Update "In stock" after deliveries or usage. When stock falls to the reorder level a red "low" tag appears here and in Analytics.','Admin, Manager'],
sup:['Suppliers','Who you buy from and what they supply.','Keep supplier names and phone numbers here so anyone can reorder quickly when stock is low.','Admin, Manager'],
exp:['Expenses','Money going out: rent, salaries, bills, raw material.','Add each expense with amount and date. Compare with revenue in AI insights to watch your cost ratio.','Admin, Manager'],
att:['Attendance','Staff clock in and clock out for today.','Press Clock in when a person arrives and Clock out when they leave. Shows each shift and who is absent.','Admin, Manager, Kitchen, Waiter'],
staff:['Staff logins','Create accounts and PINs for your team.','Add a person, choose role and branch, set a PIN. Role decides what they can see: admin all, manager operations, kitchen the board, waiter orders and tables. Change a PIN here if someone leaves.','Admin, Manager'],
cust:['Loyalty','Customers and their reward points.','Points are added automatically on paid orders when a phone number is entered (1 point per ₹10). Use top customers for thank-you offers.','Admin, Manager'],
ai:['AI insights','Plain-language suggestions from your sales, stock and costs.','Read the cards for best/slowest dish, peak hour, low stock and expense ratio, then act: run combos, add staff, reorder.','Admin, Manager'],
rep:['Reports','Download your data as CSV for Excel or accountants.','Choose a branch first, then download orders, expenses, inventory, customers, attendance or staff. "Print summary" prints this page.','Admin, Manager'],
branches:['Branches','Your outlets.','Add a new branch so tables, staff, stock and orders can be tracked separately. Admin can switch branch at the top.','Admin only']};
const help=v=>{const h=HELP[v];return h?`<details class="help" open><summary>ℹ️ What is "${h[0]}"?</summary><p><b>Purpose:</b> ${h[1]}</p><p><b>How to use:</b> ${h[2]}</p><p><b>Who can use:</b> ${h[3]}</p></details>`:''};
const vw=()=>help(view)+(V[view]||crud)();

login();
